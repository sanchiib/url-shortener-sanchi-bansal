<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SNIPLY — Short links. Big reach.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Jaro:wght@400&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --sky-top: #7EB2F2;
      --sky: #5B95EA;
      --sky-deep: #3E77D1;
      --grass: #4CAF50;
      --grass-deep: #2E8B3E;
      --bush: #3C8C46;
      --white: #FFFFFF;
      --cream-yellow: #F6F2A6;
      --cream-yellow-deep: #ECE47F;
      --brown: #A9713F;
      --brown-deep: #7C5024;
      --red: #C23B32;
      --green: #5FA764;
      --ink: #2E2A22;
      --ink-soft: #746B5C;

      --font-display: 'Baloo 2', system-ui, sans-serif;
      --font-body: 'Nunito', system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: var(--font-body);
      color: var(--ink);
      background: var(--grass);
    }

    a { color: inherit; }

    /* ============ HERO ============ */

    .hero {
      position: relative;
      min-height: 100svh;
      overflow: visible;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky) 60%, var(--sky-deep) 100%);
    }

    .hero-scene {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* ---- centered hero content: wordmark sits on top of the url bar ---- */
    .hero-content {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 0 24px;
      margin-top: -4vh;
      gap: 0;
      animation: hero-in 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes hero-in {
      from { opacity: 0; transform: translateY(18px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      margin-bottom: 0;
      position: relative;
      z-index: 3;
    }

    .snip-icon {
      display: none;
    }

    .wordmark {
      margin: 0;
      font-family: 'Jaro', sans-serif;
      font-weight: 400;
      font-size: clamp(3.5rem, 10vw, 12rem);
      line-height: 1;
      letter-spacing: 0px;
      color: var(--white);
      text-shadow: 0 4px 14px rgba(46, 42, 34, 0.28);
      clip-path: none;
      white-space: nowrap;
    }

    /* ---- decorative URL bar (visual only — the real input lives in the card below) ---- */
    .url-bar-decor {
      position: relative;
      z-index: 3;
      width: min(78vw, 900px);
      height: clamp(56px, 8vw, 92px);
      background: var(--white);
      border-radius: 999px;
      box-shadow: 0 14px 30px rgba(46, 42, 34, 0.18);
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 clamp(20px, 3vw, 40px);
      opacity: 0.96;
      margin-top: -15px;
    }
    .url-bar-decor .url-text {
      font-family: 'Nunito', monospace;
      font-weight: 700;
      font-size: clamp(1rem, 2.2vw, 1.5rem);
      color: #B9C3CE;
      white-space: nowrap;
      letter-spacing: 0.5px;
    }
    .url-bar-decor .url-line {
      flex: 1;
      height: 4px;
      border-radius: 2px;
      background: linear-gradient(90deg, #D7DEE6, transparent);
    }

    /* ---- hero buttons ---- */
    .hero-buttons {
      display: flex;
      gap: 14px;
      margin-top: 28px;
    }

    .btn-solid, .btn-ghost {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 13px 24px;
      border-radius: 12px;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.98rem;
      text-decoration: none;
      transition: transform 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
    }

    .btn-solid {
      background: var(--white);
      color: var(--ink);
      box-shadow: 0 10px 22px rgba(46, 42, 34, 0.22);
    }
    .btn-solid:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(46, 42, 34, 0.28);
    }

    .btn-ghost {
      background: rgba(255, 255, 255, 0.08);
      color: var(--white);
      border: 2px solid rgba(255, 255, 255, 0.85);
    }
    .btn-ghost:hover {
      background: rgba(255, 255, 255, 0.18);
      transform: translateY(-2px);
    }

    .btn-solid:active, .btn-ghost:active { transform: translateY(0); }
    .btn-solid:focus-visible, .btn-ghost:focus-visible {
      outline: 2px solid var(--brown);
      outline-offset: 2px;
    }

    .img-placeholder {
      position: absolute;
      z-index: 2;
      right: 4%;
      bottom: 0;
      width: min(30vw, 340px);
      aspect-ratio: 340 / 560;
      max-height: 92%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 2px dashed rgba(255, 255, 255, 0.75);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.9);
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 0.85rem;
      text-align: center;
      padding: 20px;
    }

    img.img-placeholder {
      border: none;
      background: none;
      object-fit: contain;
      object-position: center bottom;
      width: clamp(800px, 60vw, 1600px);
      height: clamp(3000px, 100vh, 5500px);
      z-index: 100;
      position: absolute;
      bottom: auto;
      top: clamp(8%, 20vw, 25%);
      left: 50%;
      transform: translateX(-10%);
      display: block;
      pointer-events: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .hero-content, .snip-icon { animation: none !important; }
    }

    /* ============ SHORTENER SECTION (grass continues) ============ */

    .shortener-section {
      position: relative;
      background: linear-gradient(180deg, var(--grass) 0%, var(--grass-deep) 100%);
      padding: 64px 20px 0;
      overflow: hidden;
    }

    .page {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      text-align: center;
    }

    .section-heading {
      margin-bottom: 26px;
    }
    .section-heading h2 {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(1.7rem, 4vw, 2.2rem);
      margin: 0 0 8px;
      color: var(--white);
      text-shadow: 0 2px 8px rgba(46, 42, 34, 0.25);
    }
    .section-heading p {
      margin: 0;
      font-size: 1rem;
      color: rgba(255, 255, 255, 0.9);
    }

    .card {
      background: var(--cream-yellow);
      border-radius: 26px;
      padding: 40px 36px;
      box-shadow: 0 20px 48px rgba(20, 60, 24, 0.28);
      border: 1px solid var(--cream-yellow-deep);
    }

    a.nav {
      display: inline-block;
      margin-bottom: 20px;
      font-size: 0.9rem;
      color: var(--sky-deep);
      text-decoration: none;
      font-weight: 700;
      font-family: var(--font-display);
    }
    a.nav:hover { text-decoration: underline; }

    form {
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: center;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      font-family: var(--font-body);
      font-size: 1rem;
      font-weight: 600;
      border: 2px solid var(--cream-yellow-deep);
      border-radius: 14px;
      background: #FFFDF0;
      color: var(--ink);
      text-align: center;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input::placeholder { color: #A79C6E; font-weight: 400; }
    input:focus {
      outline: none;
      border-color: var(--sky);
      box-shadow: 0 0 0 4px rgba(91, 149, 234, 0.18);
    }
    input:focus-visible {
      outline: 2px solid var(--brown);
      outline-offset: 2px;
    }

    .row {
      display: flex;
      gap: 12px;
      width: 100%;
    }
    .row input { flex: 1; }

    button {
      width: 100%;
      padding: 14px;
      font-family: var(--font-display);
      font-size: 1.05rem;
      font-weight: 700;
      border: none;
      border-radius: 14px;
      background: var(--sky);
      color: white;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
      margin-top: 6px;
      box-shadow: 0 10px 22px rgba(91, 149, 234, 0.32);
    }
    button:hover { background: var(--sky-deep); }
    button:active { transform: scale(0.98); }
    button:focus-visible { outline: 2px solid var(--brown-deep); outline-offset: 2px; }

    .error-inline {
      margin-top: 6px;
      padding: 11px 14px;
      border-radius: 12px;
      background: #FBEAE8;
      color: var(--red);
      font-weight: 700;
      font-size: 0.9rem;
      display: none;
      width: 100%;
    }

    footer {
      margin-top: 26px;
      font-size: 0.78rem;
      color: var(--ink-soft);
    }
    footer code {
      background: var(--cream-yellow-deep);
      color: var(--ink);
      padding: 2px 6px;
      border-radius: 6px;
    }

    /* ---- bushes/flowers along the very bottom ---- */
    .foreground-scene {
      position: relative;
      z-index: 1;
      margin-top: 56px;
      height: 140px;
    }
    .foreground-scene svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* ---- popup modal ---- */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(46, 42, 34, 0.4);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }
    .overlay.show { display: flex; }

    .modal {
      background: var(--white);
      border-radius: 22px;
      padding: 32px 30px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(46, 42, 34, 0.3);
      animation: pop-in 0.18s ease-out;
    }
    @keyframes pop-in {
      from { opacity: 0; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1); }
    }
    .modal .icon { font-size: 2rem; margin-bottom: 8px; }
    .modal h2 {
      margin: 0 0 6px;
      font-family: var(--font-display);
      font-size: 1.25rem;
      color: var(--ink);
    }
    .modal p.hint { color: var(--ink-soft); font-size: 0.85rem; margin: 0 0 18px; }

    .link-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #F8FBFF;
      border: 2px solid #DCEBFC;
      border-radius: 14px;
      padding: 10px 12px;
      margin-bottom: 18px;
    }
    .link-box a {
      flex: 1;
      color: var(--sky-deep);
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      word-break: break-all;
      text-align: left;
    }

    .copy-btn {
      width: auto;
      flex-shrink: 0;
      margin-top: 0;
      padding: 9px 15px;
      font-size: 0.85rem;
      border-radius: 10px;
      background: var(--red);
      box-shadow: none;
    }
    .copy-btn:hover { background: #a52f27; }
    .copy-btn.copied { background: var(--green); }

    .modal .close-btn {
      background: transparent;
      color: var(--ink-soft);
      border: 2px solid #DCEBFC;
      box-shadow: none;
    }
    .modal .close-btn:hover { background: #DCEBFC; color: var(--ink); }

    /* ============ RESPONSIVE ============ */

    @media (max-width: 780px) {
      .img-placeholder { width: min(38vw, 260px); opacity: 0.9; }
      .url-bar-decor { width: 88vw; }
    }

    @media (min-width: 1200px) {
      .wordmark { font-size: clamp(8rem, 12vw, 14rem); }
      .url-bar-decor { width: min(70vw, 1000px); }
    }

    @media (max-width: 560px) {
      .hero { min-height: 92svh; }
      .img-placeholder { display: none; }
      .url-bar-decor { width: 88vw; }
      .hero-buttons { flex-direction: column; width: 220px; }
      .btn-solid, .btn-ghost { width: 100%; text-align: center; }
      .card { padding: 30px 22px; border-radius: 22px; }
      .shortener-section { padding: 52px 16px 0; }
    }

    @media (max-width: 420px) {
      .row { flex-direction: column; }
    }
  </style>
</head>
<body>

  <!-- ============ HERO ============ -->
  <section class="hero" id="hero">
    <svg class="hero-scene" viewBox="0 0 1200 640" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <g opacity="0.16" fill="#FFFFFF">
        <ellipse cx="160" cy="120" rx="90" ry="34"/>
        <ellipse cx="1040" cy="90" rx="110" ry="38"/>
        <ellipse cx="620" cy="70" rx="70" ry="26"/>
      </g>
      <g fill="#FFFFFF" opacity="0.9">
        <ellipse cx="230" cy="150" rx="60" ry="22"/>
        <ellipse cx="270" cy="140" rx="42" ry="18"/>
        <ellipse cx="960" cy="170" rx="66" ry="24"/>
        <ellipse cx="1010" cy="160" rx="40" ry="17"/>
      </g>

      <!-- picket fence along the horizon -->
      <g fill="#A9C9F2" opacity="0.6">
        <rect x="0" y="470" width="1200" height="16"/>
        <g>
          <rect x="20"  y="432" width="26" height="54"/><polygon points="20,432 46,432 33,415"/>
          <rect x="70"  y="432" width="26" height="54"/><polygon points="70,432 96,432 83,415"/>
          <rect x="120" y="432" width="26" height="54"/><polygon points="120,432 146,432 133,415"/>
          <rect x="170" y="432" width="26" height="54"/><polygon points="170,432 196,432 183,415"/>
          <rect x="220" y="432" width="26" height="54"/><polygon points="220,432 246,432 233,415"/>
          <rect x="620" y="432" width="26" height="54"/><polygon points="620,432 646,432 633,415"/>
          <rect x="670" y="432" width="26" height="54"/><polygon points="670,432 696,432 683,415"/>
          <rect x="720" y="432" width="26" height="54"/><polygon points="720,432 746,432 733,415"/>
          <rect x="1030" y="432" width="26" height="54"/><polygon points="1030,432 1056,432 1043,415"/>
          <rect x="1080" y="432" width="26" height="54"/><polygon points="1080,432 1106,432 1093,415"/>
          <rect x="1130" y="432" width="26" height="54"/><polygon points="1130,432 1156,432 1143,415"/>
        </g>
      </g>

      <!-- grass strip at the very bottom of the hero, matches shortener section green -->
      <rect x="0" y="486" width="1200" height="154" fill="#4CAF50"/>
      <g fill="#3C8C46">
        <ellipse cx="60" cy="620" rx="80" ry="36"/>
        <ellipse cx="1140" cy="622" rx="80" ry="36"/>
      </g>
      <g>
        <circle cx="40" cy="602" r="7" fill="#FFFFFF"/><circle cx="40" cy="602" r="3" fill="#E8A23B"/>
        <circle cx="95" cy="610" r="6" fill="#FFFFFF"/><circle cx="95" cy="610" r="2.5" fill="#E8A23B"/>
        <circle cx="1160" cy="604" r="7" fill="#FFFFFF"/><circle cx="1160" cy="604" r="3" fill="#E8A23B"/>
        <circle cx="1105" cy="612" r="6" fill="#FFFFFF"/><circle cx="1105" cy="612" r="2.5" fill="#E8A23B"/>
      </g>
    </svg>

    <div class="hero-content">
      <div class="brand">
        <svg class="snip-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="14" cy="12" r="6" fill="none" stroke="#F2F2F2" stroke-width="3"/>
          <circle cx="14" cy="36" r="6" fill="none" stroke="#F2F2F2" stroke-width="3"/>
          <path d="M18 15L44 44" stroke="#C23B32" stroke-width="3.4" stroke-linecap="round"/>
          <path d="M18 33L44 4" stroke="#C23B32" stroke-width="3.4" stroke-linecap="round"/>
        </svg>
        <h1 class="wordmark">SNIPLY</h1>
      </div>

      <div class="url-bar-decor" aria-hidden="true">
        <span class="url-text">http://www.</span>
        <span class="url-line"></span>
      </div>

      <div class="hero-buttons">
        <a class="btn-solid" href="#shortener">Start Snipping</a>
        <a class="btn-ghost" href="/analytics">View Insights</a>
      </div>
    </div>

      <img class="img-placeholder" src="{{ url_for('static', filename='hero-character.png') }}" alt="">
  </section>

  <!-- ============ SHORTENER SECTION ============ -->
  <section class="shortener-section" id="shortener">
    <div class="page">
      <div class="section-heading">
        <h2>Snip your link.</h2>
        <p>Turn long, messy URLs into short, shareable links.</p>
      </div>

      <div class="card">
        <form id="shorten-form">
          <input type="url" id="url" placeholder="https://example.com/some/long/path" required>
          <div class="row">
            <input type="text" id="alias" placeholder="Custom alias (optional)">
            <input type="number" id="ttl" placeholder="Expires in seconds" min="1">
          </div>
          <button type="submit" id="submit-btn">Shorten</button>
          <div class="error-inline" id="error-inline"></div>
        </form>

    
      </div>
    </div>

    <div class="foreground-scene" aria-hidden="true">
      <svg viewBox="0 0 1200 140" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="0" y="0" width="1200" height="140" fill="#2E8B3E"/>
        <g fill="#26762F">
          <ellipse cx="90" cy="120" rx="110" ry="46"/>
          <ellipse cx="220" cy="130" rx="90" ry="40"/>
          <ellipse cx="980" cy="122" rx="110" ry="46"/>
          <ellipse cx="1110" cy="132" rx="90" ry="40"/>
        </g>
        <g>
          <circle cx="60" cy="88" r="9" fill="#FFFFFF"/><circle cx="60" cy="88" r="3.5" fill="#E8A23B"/>
          <circle cx="130" cy="98" r="8" fill="#FFFFFF"/><circle cx="130" cy="98" r="3" fill="#E8A23B"/>
          <circle cx="250" cy="104" r="7" fill="#FFFFFF"/><circle cx="250" cy="104" r="3" fill="#E8A23B"/>
          <circle cx="1140" cy="90" r="9" fill="#FFFFFF"/><circle cx="1140" cy="90" r="3.5" fill="#E8A23B"/>
          <circle cx="1060" cy="100" r="8" fill="#FFFFFF"/><circle cx="1060" cy="100" r="3" fill="#E8A23B"/>
          <circle cx="960" cy="106" r="7" fill="#FFFFFF"/><circle cx="960" cy="106" r="3" fill="#E8A23B"/>
        </g>
      </svg>
    </div>
  </section>

  <!-- Popup shown after a successful shorten -->
  <div class="overlay" id="overlay">
    <div class="modal">
      <h2>Your short link is ready</h2>
      <p class="hint">Click copy, or open it in a new tab.</p>
      <div class="link-box">
        <a id="short-url-link" href="#" target="_blank" rel="noopener"></a>
        <button class="copy-btn" id="copy-btn" type="button">Copy</button>
      </div>
      <button class="close-btn" id="close-btn" type="button">Close</button>
    </div>
  </div>

  <script>
    const form = document.getElementById("shorten-form");
    const submitBtn = document.getElementById("submit-btn");
    const errorInline = document.getElementById("error-inline");

    const overlay = document.getElementById("overlay");
    const shortUrlLink = document.getElementById("short-url-link");
    const copyBtn = document.getElementById("copy-btn");
    const closeBtn = document.getElementById("close-btn");

    function showError(message) {
      errorInline.textContent = message;
      errorInline.style.display = "block";
    }

    function hideError() {
      errorInline.style.display = "none";
    }

    function openModal(shortUrl) {
      shortUrlLink.href = shortUrl;
      shortUrlLink.textContent = shortUrl;
      copyBtn.textContent = "Copy";
      copyBtn.classList.remove("copied");
      overlay.classList.add("show");
    }

    function closeModal() {
      overlay.classList.remove("show");
    }

    closeBtn.addEventListener("click", closeModal);
    overlay.addEventListener("click", (e) => {
      if (e.target === overlay) closeModal();
    });

    copyBtn.addEventListener("click", async () => {
      const text = shortUrlLink.href;
      try {
        await navigator.clipboard.writeText(text);
      } catch (err) {
        const temp = document.createElement("textarea");
        temp.value = text;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand("copy");
        document.body.removeChild(temp);
      }
      copyBtn.textContent = "Copied!";
      copyBtn.classList.add("copied");
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      hideError();

      const url = document.getElementById("url").value.trim();
      const alias = document.getElementById("alias").value.trim();
      const ttl = document.getElementById("ttl").value.trim();

      const body = { url };
      if (alias) body.alias = alias;
      if (ttl) body.ttl_seconds = parseInt(ttl, 10);

      submitBtn.disabled = true;
      submitBtn.textContent = "Shortening...";

      try {
        const res = await fetch("/shorten", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const data = await res.json();

        if (!res.ok) {
          showError(data.error || "Something went wrong.");
          return;
        }

        form.reset();
        openModal(data.short_url);
      } catch (err) {
        showError("Network error. Please try again.");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Shorten";
      }
    });
  </script>
</body>
</html>
